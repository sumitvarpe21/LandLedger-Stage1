spring.config.import=optional:file:./.env[.properties]
spring.application.name=landledger-backend
server.port=${SERVER_PORT:8081}
landledger.frontend-origin=${LANDLEDGER_FRONTEND_ORIGIN:http://localhost:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/landledger}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:landledger}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
landledger.jwt-secret=${LANDLEDGER_JWT_SECRET}
landledger.jwt-issuer=landledger-backend
landledger.jwt-expiration=PT8H
landledger.admin.name=${LANDLEDGER_ADMIN_NAME:}
landledger.admin.email=${LANDLEDGER_ADMIN_EMAIL:}
landledger.admin.password=${LANDLEDGER_ADMIN_PASSWORD:}
landledger.blockchain.enabled=${LANDLEDGER_BLOCKCHAIN_ENABLED:false}
landledger.blockchain.rpc-url=${LANDLEDGER_BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
landledger.blockchain.from-address=${LANDLEDGER_BLOCKCHAIN_FROM_ADDRESS:}
landledger.blockchain.contract-address=${LANDLEDGER_BLOCKCHAIN_CONTRACT_ADDRESS:}
landledger.blockchain.poll-interval-ms=${LANDLEDGER_BLOCKCHAIN_POLL_INTERVAL_MS:5000}
